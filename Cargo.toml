[package]
name = "smolvm-tray"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
description = "Cross-platform system tray for the smolvm kite VM (MCP 8090 + CDP 9222 via -p)"

[dependencies]
slint = { version = "=1.17.1" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }

[build-dependencies]
slint-build = "=1.17.1"

[profile.release]
strip = true
lto = "thin"
opt-level = "z"
